<!DOCTYPE html>
<html>
<head>
    <title>Borrowing History</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2 style="text-align:center;">My Borrowing History</h2>

{% if records %}
<table border="1" cellpadding="6" style="margin:auto;">
    <tr>
        <th>Record ID</th>
        <th>Book ID</th>
        <th>Borrow Date</th>
        <th>Return Date</th>
    </tr>

    {% for r in records %}
    <tr>
        <td>{{ r.recordID }}</td>
        <td>{{ r.bookID }}</td>
        <td>{{ r.borrowDate }}</td>
        <td>{{ r.returnDate if r.returnDate else "Not Returned" }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p style="text-align:center;">No borrowing history found.</p>
{% endif %}

</body>
</html>
