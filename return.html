<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/style.css">

    <title>Return Book</title>
</head>
<body>

    <h1>Return a Book</h1>

    {% if records %}
        <form method="POST">
            <label>Your Borrowed Books:</label><br>

            <select name="recordID">
                {% for r in records %}
                    <option value="{{ r.recordID }}">
                        Record {{ r.recordID }} — Book ID {{ r.bookID }} (Borrowed: {{ r.borrowDate }})
                    </option>
                {% endfor %}
            </select>

            <br><br>
            <label>Book ID:</label>
            <input name="bookID" placeholder="Enter the bookID to return" required>

            <br><br>
            <button type="submit">Return</button>
        </form>
    {% else %}
        <p>No borrowed books to return.</p>
    {% endif %}

    <br><a href="/user/dashboard">Back</a>

</body>
</html>
