<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/style.css">

    <title>Search Books</title>
</head>
<body>

    <h1>Search for a Book</h1>

    <form method="POST">
        <input name="query" placeholder="Enter book title">
        <button type="submit">Search</button>
    </form>

    <h2>Results:</h2>
    <ul>
        {% for b in books %}
            <li>
                {{ b.title }} — {{ b.author }}  
                (Status: {{ b.status }})
            </li>
        {% endfor %}
    </ul>

    <br>
    <a href="/user/dashboard">Back to Dashboard</a>

</body>
</html>
