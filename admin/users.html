<!DOCTYPE html>
<html>
<head>
    <title>Manage Users</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2 style="text-align:center;">Manage Users (Admin)</h2>

{% if users %}
<table border="1" cellpadding="6" style="margin:auto;">
    <tr>
        <th>User ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
    </tr>

    {% for u in users %}
    <tr>
        <td>{{ u.userid }}</td>
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.role }}</td>
        <td>
            {% if u.role != "admin" %}
                <a href="/admin/users/delete/{{ u.userid }}"
                   onclick="return confirm('Are you sure you want to delete this user?');">
                   Delete
                </a>
            {% else %}
                ---
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p style="text-align:center;">No users found.</p>
{% endif %}

<br>
<p style="text-align:center;">
    <a href="/user/dashboard">Back to Dashboard</a>
</p>

</body>
</html>
